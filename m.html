<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Setu Meet</title>
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ধাপ ১: ভাষা বাছাই (বাধ্যতামূলক) -->
<div class="join" id="stepLang">
  <div class="logo"><img src="icon.svg" alt="">Setu Meet</div>
  <div class="panel">
    <h2 id="langTitle"></h2>
    <p class="why" data-i18n="langWhy"></p>
    <p class="why2" id="langWhyEn"></p>
    <div class="req" id="reqI"><span data-i18n="langRequired"></span></div>
    <input class="field" id="langSearch" data-i18n-ph="search" autocomplete="off">
    <div class="lang-grid" id="langGrid"></div>
    <button class="btn pri" id="langNext" disabled style="width:100%" data-i18n="next"></button>
  </div>
</div>

<!-- ধাপ ২: নাম + চ্যাট/কল -->
<div class="join hidden" id="stepSetup">
  <div class="logo"><img src="icon.svg" alt="">Setu Meet</div>
  <div class="panel">
    <div class="setup">
      <div>
        <div class="preview" id="preview">
          <video id="pvVideo" autoplay playsinline muted></video>
          <div class="av" id="pvAv">?</div>
          <div class="pv-ctl">
            <button class="cb" id="pvMic"></button>
            <button class="cb" id="pvCam"></button>
          </div>
        </div>
        <button class="linkbtn" id="changeLang"></button>
      </div>
      <div>
        <div class="label" data-i18n="yourName"></div>
        <input class="field" id="name" data-i18n-ph="namePh" maxlength="40" autocomplete="name">
        <div class="label" data-i18n="voice"></div>
        <div class="seg" id="genderSeg">
          <button data-g="f" data-i18n="female"></button>
          <button data-g="m" data-i18n="male"></button>
        </div>
        <div class="label" data-i18n="howJoin"></div>
        <div class="modes">
          <button class="mode" id="goCall"><div class="mi" id="callI"></div><div><b data-i18n="callOpt"></b><span data-i18n="callDesc"></span></div></button>
          <button class="mode" id="goChat"><div class="mi" id="chatI"></div><div><b data-i18n="chatOpt"></b><span data-i18n="chatDesc"></span></div></button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ধাপ ৩: মিটিং রুম -->
<div class="room chatmode hidden" id="room">
  <div class="chathead">
    <img src="icon.svg" alt="" style="width:32px;height:32px">
    <div class="grow"><b>Setu Meet</b><span id="chCount"></span></div>
    <button class="cb flat" id="chLink" data-i18n-title="copy"></button>
    <button class="cb flat" id="chPeople" data-i18n-title="people"></button>
    <button class="cb flat" id="chMore" data-i18n-title="more"></button>
    <button class="btn pri" id="chCall" style="padding:9px 14px"><span id="chCallI"></span><span class="hide-m" data-i18n="joinCall"></span></button>
    <button class="cb end" id="chLeave" data-i18n-title="leaveCall" style="width:46px;height:42px"></button>
  </div>
  <div class="room-main">
    <div class="stage" id="stage">
      <div class="grid" id="grid"></div>
      <div class="alone hidden" id="alone"><span data-i18n="alone"></span><button class="btn ghost" id="aloneCopy" style="padding:7px 12px"><span data-i18n="copy"></span></button></div>
      <div class="captions" id="caps"></div>
      <div class="react-layer" id="reactLayer"></div>
    </div>
    <div class="side hidden" id="side">
      <div class="side-h"><span id="sideTitle"></span><button class="cb flat" id="sideClose"></button></div>
      <div class="side-b" id="sideBody">
        <div class="msgs" id="msgs"><div class="empty" id="emptyChat" data-i18n="emptyChat"></div></div>
        <div class="plist hidden" id="plist"></div>
      </div>
      <div class="compose" id="compose">
        <button class="cb" id="dictate" data-i18n-title="voiceType"></button>
        <textarea id="msgIn" rows="1" data-i18n-ph="typeMsg"></textarea>
        <button class="cb sendb" id="sendBtn" data-i18n-title="send"></button>
      </div>
    </div>
  </div>
  <div class="bar callbar">
    <div class="left"><span id="clock"></span><span>|</span><span class="code" id="codeTxt"></span><span id="recBadge"></span></div>
    <div class="mid">
      <button class="cb" id="bMic" data-i18n-title="mic"></button>
      <button class="cb" id="bCam" data-i18n-title="cam"></button>
      <button class="cb hide-m" id="bCC" data-i18n-title="captions"></button>
      <button class="cb" id="bReact" data-i18n-title="reactions"></button>
      <button class="cb hide-m" id="bScreen" data-i18n-title="screen"></button>
      <button class="cb hide-m" id="bHand" data-i18n-title="hand"></button>
      <button class="cb show-m" id="bChatM" data-i18n-title="chat"></button>
      <button class="cb" id="bMore" data-i18n-title="more"></button>
      <button class="cb end" id="bLeave" data-i18n-title="leaveCall"></button>
    </div>
    <div class="right">
      <button class="cb flat" id="bPeople" data-i18n-title="people"></button>
      <button class="cb flat" id="bChat" data-i18n-title="chat"></button>
    </div>
  </div>
  <div class="pop reacts hidden" id="reactPop"></div>
  <div class="pop menu hidden" id="morePop"></div>
</div>

<!-- ভাষা বদলানোর মডাল -->
<div class="modal-bg hidden" id="langModal">
  <div class="modal" style="max-width:620px">
    <h3 data-i18n="changeLang"></h3>
    <input class="field" id="langSearch2" data-i18n-ph="search" autocomplete="off" style="margin-top:10px">
    <div class="lang-grid" id="langGrid2"></div>
    <div class="row"><button class="btn ghost" id="langModalClose" data-i18n="close"></button></div>
  </div>
</div>

<!-- অনুমতির অপেক্ষা -->
<div class="ended hidden" id="waitScr">
  <div>
    <div class="spin"></div>
    <h2 data-i18n="waiting"></h2>
    <p style="color:var(--mut);margin:-8px 0 18px" data-i18n="waitingSub"></p>
    <div class="row"><button class="btn ghost" id="waitCancel" data-i18n="cancel"></button></div>
  </div>
</div>

<!-- কেউ ঢুকতে চাইলে হোস্টের কাছে কার্ড -->
<div id="knocks"></div>

<!-- বের হওয়ার পর -->
<div class="ended hidden" id="ended">
  <div>
    <h2 id="endedTxt" data-i18n="ended"></h2>
    <div class="row">
      <button class="btn pri" id="rejoin" data-i18n="rejoin"></button>
      <a class="btn ghost" href="index.html" data-i18n="home"></a>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="mqtt.min.js"></script>
<script src="net.js"></script>
<script src="langs.js"></script>
<script src="common.js"></script>
<script src="meet.js"></script>
</body>
</html>
